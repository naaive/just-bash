[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "just-bash-py"
version = "0.1.0"
description = "Python rewrite of just-bash: a sandboxed bash interpreter with in-memory virtual filesystem"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "just-bash-py contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Shells",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[project.scripts]
just-bash = "just_bash.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/just_bash"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # function calls in defaults (common in dataclasses)
    "SIM108", # ternary readability
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.pyright]
include = ["src", "tests", "tools"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
reportMissingTypeStubs = false
reportPrivateUsage = false
reportUnnecessaryComparison = false
extraPaths = ["."]  # so ``from tools.real_bash import ...`` resolves

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: slower integration tests",
]

name: just-bash-py CI

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/just-bash-py.yml"
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/just-bash-py.yml"

defaults:
  run:
    working-directory: python

jobs:
  test:
    name: ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python ${{ matrix.python-version }}
        run: uv venv --python ${{ matrix.python-version }} .venv

      - name: Install dev dependencies
        run: |
          source .venv/bin/activate
          uv pip install -e '.[dev]'

      - name: Lint
        run: |
          source .venv/bin/activate
          ruff check .
          ruff format --check .

      - name: Type-check
        run: |
          source .venv/bin/activate
          pyright

      - name: Run tests (excluding comparison)
        run: |
          source .venv/bin/activate
          pytest --ignore=tests/comparison -q

      - name: Run comparison tests against real bash
        run: |
          source .venv/bin/activate
          pytest tests/comparison -q

# SonarCloud project configuration.
# https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

sonar.projectKey=naaive_just-bash
sonar.organization=naaive

# Files we want analysed.
sonar.sources=packages/just-bash/src,python/src

# Test directories: indexed but counted separately.
sonar.tests=python/tests,packages/just-bash/src/**/*.test.ts

# Directories we explicitly DO NOT want analysed:
# - python/tests/spec/scripts/*.test.sh: bash fixtures we run through both
#   real bash and our interpreter; intentionally idiomatic shell.
# - python/scripts/**: developer-only shell wrappers (record-fixtures,
#   run-spec) that invoke the host bash. They live outside the source
#   tree and are skipped from production analysis.
# - vendor/**: pre-built CPython WASM and friends.
sonar.exclusions=python/tests/**,python/scripts/**,packages/just-bash/vendor/**,vendor/**,**/dist/**,**/node_modules/**

sonar.cpd.exclusions=python/tests/**,python/scripts/**,packages/just-bash/vendor/**

# SonarCloud project configuration.
# https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

sonar.projectKey=naaive_just-bash
sonar.organization=naaive

# Files we want analysed.
sonar.sources=packages/just-bash/src,python/src

# Directories we explicitly DO NOT want analysed:
# - tests/spec/scripts/*.test.sh are bash fixtures we run through both
#   real bash and our interpreter to assert byte-identical behaviour.
#   They intentionally exercise patterns SonarCloud's bash plugin
#   classifies as "code smells" (missing return / missing default case)
#   because real-world scripts in the wild use them this way.
# - python/tests/** are pytest harnesses, not production code.
# - vendor/** ships pre-built CPython WASM and friends.
sonar.exclusions=python/tests/**,packages/just-bash/vendor/**,vendor/**,**/dist/**,**/node_modules/**

# Same exclusions for the duplication and coverage analyses.
sonar.cpd.exclusions=python/tests/**,packages/just-bash/vendor/**

# Treat the two confirmed-safe subprocess calls in the spec runner as
# reviewed: they invoke a hard-coded list of bash binaries with a fixed
# argv shape; ``shell=True`` is never used.
sonar.python.bandit.skip=B404,B603

# Test files (still indexed but counted separately).
sonar.tests=python/tests,packages/just-bash/src/**/*.test.ts

# SonarCloud project configuration.
# https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

sonar.projectKey=naaive_just-bash
sonar.organization=naaive

# Files we want analysed.
sonar.sources=packages/just-bash/src,python/src

# Directories we explicitly DO NOT want analysed:
# - tests/spec/scripts/*.test.sh are bash fixtures we run through both
#   real bash and our interpreter to assert byte-identical behaviour.
# - python/tests/** are pytest harnesses, not production code.
# - python/tools/** is a developer-only fixture-recording helper.
# - vendor/** ships pre-built CPython WASM and friends.
sonar.exclusions=python/tests/**,python/tools/**,packages/just-bash/vendor/**,vendor/**,**/dist/**,**/node_modules/**

# Rule-specific ignores: the bash recording helper in python/tools/
# invokes a vetted bash binary with a fixed-shape argv. This is the
# canonical way to clear "subprocess starting" hotspots that have been
# hand-reviewed safe but live in code that must remain (RECORD_FIXTURES
# would otherwise stop working).
sonar.issue.ignore.multicriteria=sub1,sub2,sub3,sub4
sonar.issue.ignore.multicriteria.sub1.ruleKey=python:S4036
sonar.issue.ignore.multicriteria.sub1.resourceKey=python/tools/**
sonar.issue.ignore.multicriteria.sub2.ruleKey=python:S4721
sonar.issue.ignore.multicriteria.sub2.resourceKey=python/tools/**
sonar.issue.ignore.multicriteria.sub3.ruleKey=python:S4423
sonar.issue.ignore.multicriteria.sub3.resourceKey=python/tools/**
sonar.issue.ignore.multicriteria.sub4.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.sub4.resourceKey=python/tools/**

# Same exclusions for the duplication and coverage analyses.
sonar.cpd.exclusions=python/tests/**,python/tools/**,packages/just-bash/vendor/**

# Test files (still indexed but counted separately).
sonar.tests=python/tests,packages/just-bash/src/**/*.test.ts
